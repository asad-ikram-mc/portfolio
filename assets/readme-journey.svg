<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Journey: Lahore school, FAST-NUCES 2017, Fiverr 2018, Dubizzle Labs 2022, Chevening and Portsmouth 2024, Fluency and Artemis AI 2025, research and PhD 2026">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#F4F7FB"/><stop offset="1" stop-color="#EEF6F5"/></linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#3B5BDB"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',Consolas,monospace}
      .draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 3.2s cubic-bezier(.4,0,.2,1) forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .p{opacity:0;animation:pop .7s ease forwards}
      @keyframes pop{from{opacity:0}to{opacity:1}}
      .halo{animation:halo 2.6s ease-out infinite}
      @keyframes halo{0%{opacity:.8}100%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="230" rx="20" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="229" rx="20" fill="none" stroke="#0F1B33" stroke-opacity=".08"/>
  <path d="M70 110 H1130" stroke="#0F1B33" stroke-opacity=".08" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path class="draw" d="M70 110 H1130" stroke="url(#ln)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g class="t" text-anchor="middle">
    <g class="p" style="animation-delay:.2s"><circle cx="90" cy="110" r="8" fill="#fff" stroke="#3B5BDB" stroke-width="3"/><text x="90" y="72" class="m" font-size="13" fill="#3B5BDB">SCHOOL</text><text x="90" y="148" font-size="15" fill="#0F1B33" font-weight="700">Lahore</text><text x="90" y="170" font-size="12" fill="#5B6780">Crescent</text></g>
    <g class="p" style="animation-delay:.6s"><circle cx="260" cy="110" r="8" fill="#fff" stroke="#3B5BDB" stroke-width="3"/><text x="260" y="72" class="m" font-size="13" fill="#3B5BDB">2017</text><text x="260" y="148" font-size="15" fill="#0F1B33" font-weight="700">FAST-NUCES</text><text x="260" y="170" font-size="12" fill="#5B6780">Karachi → CFD</text></g>
    <g class="p" style="animation-delay:1s"><circle cx="430" cy="110" r="8" fill="#fff" stroke="#3561D0" stroke-width="3"/><text x="430" y="72" class="m" font-size="13" fill="#3561D0">2018</text><text x="430" y="148" font-size="15" fill="#0F1B33" font-weight="700">Fiverr</text><text x="430" y="170" font-size="12" fill="#5B6780">442 orders</text></g>
    <g class="p" style="animation-delay:1.4s"><circle cx="600" cy="110" r="8" fill="#fff" stroke="#2C6FC4" stroke-width="3"/><text x="600" y="72" class="m" font-size="13" fill="#2C6FC4">2022</text><text x="600" y="148" font-size="15" fill="#0F1B33" font-weight="700">Dubizzle Labs</text><text x="600" y="170" font-size="12" fill="#5B6780">10 countries</text></g>
    <g class="p" style="animation-delay:1.8s"><circle cx="770" cy="110" r="8" fill="#fff" stroke="#1F82B5" stroke-width="3"/><text x="770" y="72" class="m" font-size="13" fill="#1F82B5">2024</text><text x="770" y="148" font-size="15" fill="#0F1B33" font-weight="700">Chevening</text><text x="770" y="170" font-size="12" fill="#5B6780">MSc, Portsmouth</text></g>
    <g class="p" style="animation-delay:2.2s"><circle cx="940" cy="110" r="8" fill="#fff" stroke="#1395AA" stroke-width="3"/><text x="940" y="72" class="m" font-size="13" fill="#1395AA">2025</text><text x="940" y="148" font-size="15" fill="#0F1B33" font-weight="700">Fluency + Artemis AI</text><text x="940" y="170" font-size="12" fill="#5B6780">M+C Saatchi · CTO</text></g>
    <g class="p" style="animation-delay:2.6s"><circle class="halo" cx="1110" cy="110" r="16" fill="none" stroke="#F06A4E" stroke-width="2"/><circle cx="1110" cy="110" r="8" fill="#F06A4E"/><text x="1110" y="72" class="m" font-size="13" fill="#E0553A">2026</text><text x="1110" y="148" font-size="15" fill="#0F1B33" font-weight="700">Research</text><text x="1110" y="170" font-size="12" fill="#5B6780">arXiv · PhD</text></g>
  </g>
</svg>
