<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Asad Ikram: data engineer, Chevening Scholar, co-founder and CTO of Artemis AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0d1222"/></linearGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#64A8FF"/><stop offset=".5" stop-color="#7B61FF"/><stop offset="1" stop-color="#00C6FB"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#0071E3" stop-opacity=".55"/><stop offset="1" stop-color="#0071E3" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#7B61FF" stop-opacity=".5"/><stop offset="1" stop-color="#7B61FF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#64A8FF" opacity=".16"/></pattern>
    <style>
      .t{font-family:'Segoe UI',Manrope,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',Consolas,monospace}
      .fade{opacity:0;animation:in 1s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
      @keyframes in{from{opacity:0}to{opacity:1}}
      .node{animation:pulse 2.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .flow{stroke-dasharray:6 10;animation:dash 3s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-64}}
      .cursor{animation:blink 1s step-end infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#dots)"/>
  <circle cx="180" cy="60" r="220" fill="url(#o1)"><animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="300" r="240" fill="url(#o2)"><animate attributeName="cy" values="300;230;300" dur="10s" repeatCount="indefinite"/></circle>
  <!-- network -->
  <g stroke="#64A8FF" stroke-opacity=".35" stroke-width="1.2" fill="none">
    <path class="flow" d="M820 70 L930 120 L1040 80 L1120 150 L1010 210 L900 190 L820 70"/>
    <path class="flow" d="M930 120 L1010 210 M1040 80 L900 190"/>
  </g>
  <g fill="#64A8FF">
    <circle class="node" cx="820" cy="70" r="4"/><circle class="node" cx="930" cy="120" r="5" style="animation-delay:.4s"/>
    <circle class="node" cx="1040" cy="80" r="4" style="animation-delay:.8s"/><circle class="node" cx="1120" cy="150" r="4" style="animation-delay:1.2s"/>
    <circle class="node" cx="1010" cy="210" r="5" style="animation-delay:1.6s"/><circle class="node" cx="900" cy="190" r="4" style="animation-delay:2s"/>
  </g>
  <circle cx="930" cy="120" r="6" fill="#30D158"><animate attributeName="r" values="6;14;6" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="64" y="70" class="m fade d1" font-size="15" fill="#64A8FF" letter-spacing="3">PORTFOLIO · LAHORE → PORTSMOUTH → LAHORE</text>
  <text x="62" y="150" class="t fade d2" font-size="66" font-weight="800" fill="#F5F5F7" letter-spacing="-1.5">Asad <tspan fill="url(#tx)">Ikram</tspan></text>
  <text x="64" y="198" class="t fade d3" font-size="22" fill="#C7CCD6">Data engineer · Chevening Scholar 2024/25 · Co-founder &amp; CTO, Artemis AI</text>
  <g class="fade d4">
    <text x="64" y="262" class="m" font-size="17" fill="#98A2B3">$ <tspan fill="#F5F5F7">turning social media into numbers people can trust</tspan><tspan class="cursor" fill="#64A8FF">▍</tspan></text>
  </g>
</svg>
