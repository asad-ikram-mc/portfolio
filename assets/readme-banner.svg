<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Asad Ikram: data engineer, Chevening Scholar, co-founder and CTO of Artemis AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F7FB"/><stop offset=".6" stop-color="#EEF3FF"/><stop offset="1" stop-color="#EAF6F4"/></linearGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#3B5BDB"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#3B5BDB"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#3B5BDB" stop-opacity=".22"/><stop offset="1" stop-color="#3B5BDB" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#0EA5A4" stop-opacity=".22"/><stop offset="1" stop-color="#0EA5A4" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#F06A4E" stop-opacity=".14"/><stop offset="1" stop-color="#F06A4E" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#3B5BDB" opacity=".10"/></pattern>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .s{font-family:Georgia,'Times New Roman',serif}
      .m{font-family:'JetBrains Mono',Consolas,monospace}
      .fade{opacity:0;animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}.d4{animation-delay:1.3s}
      @keyframes in{from{opacity:0}to{opacity:1}}
      .node{animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .flow{stroke-dasharray:4 9;animation:dash 4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-52}}
      .cursor{animation:blink 1.1s step-end infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#dots)"/>
  <circle cx="200" cy="40" r="240" fill="url(#o1)"><animate attributeName="cx" values="200;280;200" dur="16s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="300" r="260" fill="url(#o2)"><animate attributeName="cy" values="300;240;300" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="40" r="160" fill="url(#o3)"><animate attributeName="cx" values="760;820;760" dur="18s" repeatCount="indefinite"/></circle>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#0F1B33" stroke-opacity=".08"/>
  <g stroke="url(#ln)" stroke-opacity=".55" stroke-width="1.3" fill="none">
    <path class="flow" d="M820 70 L930 120 L1040 80 L1120 150 L1010 210 L900 190 L820 70"/>
    <path class="flow" d="M930 120 L1010 210 M1040 80 L900 190"/>
  </g>
  <g>
    <circle class="node" cx="820" cy="70" r="4.5" fill="#3B5BDB"/><circle class="node" cx="930" cy="120" r="5.5" fill="#3B5BDB" style="animation-delay:.5s"/>
    <circle class="node" cx="1040" cy="80" r="4.5" fill="#2F7FC4" style="animation-delay:1s"/><circle class="node" cx="1120" cy="150" r="4.5" fill="#0EA5A4" style="animation-delay:1.5s"/>
    <circle class="node" cx="1010" cy="210" r="5.5" fill="#0EA5A4" style="animation-delay:2s"/><circle class="node" cx="900" cy="190" r="4.5" fill="#2F7FC4" style="animation-delay:2.5s"/>
  </g>
  <circle cx="930" cy="120" r="6" fill="none" stroke="#F06A4E" stroke-width="2"><animate attributeName="r" values="6;18;6" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="930" cy="120" r="4" fill="#F06A4E"/>
  <text x="64" y="72" class="m fade d1" font-size="14" fill="#3B5BDB" letter-spacing="3">PORTFOLIO · LAHORE → PORTSMOUTH → LAHORE</text>
  <text x="62" y="152" class="s fade d2" font-size="68" fill="#0F1B33" letter-spacing="-1">Asad <tspan fill="url(#tx)" font-style="italic">Ikram</tspan></text>
  <text x="64" y="198" class="t fade d3" font-size="21" fill="#3D4A63">Data engineer · Chevening Scholar 2024/25 · Co-founder &amp; CTO, Artemis AI</text>
  <g class="fade d4">
    <rect x="64" y="236" width="560" height="40" rx="20" fill="#FFFFFF" fill-opacity=".75" stroke="#3B5BDB" stroke-opacity=".18"/>
    <circle cx="86" cy="256" r="5" fill="#0EA5A4"/>
    <text x="102" y="262" class="m" font-size="15" fill="#0F1B33">turning social media into numbers people can trust<tspan class="cursor" fill="#F06A4E">▍</tspan></text>
  </g>
</svg>
